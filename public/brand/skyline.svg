<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <!-- Perspective ground lines (V-shaped converging to center bottom) -->
  <polygon points="60,68 0,52 0,58 60,76 120,58 120,52" fill="currentColor"/>

  <!-- Far-left small building (outline only) -->
  <rect x="4" y="46" width="6" height="16" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Left cluster: tall narrow spire -->
  <polygon points="17,28 20,18 23,28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="17" y="28" width="6" height="22" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Left cluster: medium building -->
  <rect x="24" y="34" width="12" height="17" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Left cluster: tall building -->
  <rect x="37" y="22" width="14" height="29" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Center-left tall tower (tallest left of center) with pointed top -->
  <polygon points="51,8 56,2 61,8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="51" y="8" width="10" height="43" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- Center tower (tallest, dead center) -->
  <rect x="62" y="4" width="12" height="47" fill="none" stroke="currentColor" stroke-width="2.8"/>

  <!-- Right cluster: tall tower with pointed top -->
  <polygon points="75,10 79,4 83,10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="75" y="10" width="8" height="41" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- Right cluster: medium building -->
  <rect x="84" y="30" width="12" height="21" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Right cluster: narrow building -->
  <rect x="97" y="38" width="8" height="13" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- Far-right small building -->
  <rect x="108" y="43" width="7" height="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
</svg>
